name: MARE CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-verification:
    name: Frontend Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./mare/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Production Next.js Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: 44ef91b9231f4e72ad79f4c40b8a1c8f9000a6a3e5c9424bb9b30b42d6bd4db6
          NEXT_PUBLIC_API_URL: http://localhost:8555

  backend-verification:
    name: Backend Tests & Security Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mare/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Verify Python Compilation
        run: python -m py_compile main.py auth.py database.py models.py security_system.py mistral_service.py

      - name: Run Persistence Integration Test
        run: python -c "from database import init_db; init_db(); print('Database schema check passed')"

      - name: Run Multi-Tenant Auth Tests
        run: python test_auth_multitenant.py

